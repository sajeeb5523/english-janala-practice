<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Janala</title>

    <!-- daisyUI and tailwindcss -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header class=" justify-between bg-[#C6BDBD20] border-b py-6 border-[#C6BDBD]">

        <nav class="w-11/12 mx-auto flex justify-between ">
            <!-- left side -->
            <div>
                <div class="logo flex items-center font-bold">
                    <h1 class="text-xl md:text-2xl">English</h1>
                    <img class="w-8 h-8 md:w-10 md:h-10" src="assets/logo.png" alt="">
                    <h1 class="text-xl md:text-[22px]">জানালা</h1>
                </div>
            </div>

            <!-- right side -->
            <div class="flex space-x-4 items-center">
                <div class="faq_btn">
                    <button
                        class="btn btn-sm md:btn-md btn-outline btn-primary font-semibold text-sm group hover:text-white">
                        <img class="w-5 h-5 gap-2 transition-all duration-200 group-hover:brightness-0 group-hover:invert"
                            src="assets/fa-circle-question.png" alt="">
                        FAQ
                    </button>
                </div>

                <div class="learn_btn">
                    <button
                        class="btn btn-sm md:btn-md  btn-outline btn-primary font-semibold text-sm group hover:text-white"><img
                            class="w-5 h-5 gap-2 transition-all duration-200 group-hover:brightness-0 group-hover:invert"
                            src="assets/fa-book-open.png" alt=""> FAQ</button>
                </div>

                <div class="logout_btn">
                    <button
                        class="btn btn-sm md:btn-md btn-outline btn-primary font-semibold text-sm group hover:text-white"><img
                            class="w-5 h-5 gap-2 transition-all duration-200 group-hover:brightness-0 group-hover:invert"
                            src="assets/fa-arrow-right-from-bracket.png" alt=""> FAQ</button>
                </div>
            </div>
        </nav>
    </header>

    <!-- hero section -->
    <section class="w-11/12 mx-auto">

        <div class="md:flex items-center justify-between gap-10 mt-14 md:mt-0 mb-14 md:mb-28">

            <!-- left side -->
            <div class="w-full md:w-1/2 space-y-5">
                <h1 class="font-extrabold text-3xl md:text-5xl"><span class="text-[#00BCFF]">English</span> is Easy!!
                </h1>

                <p class="text-justify max-w-xl text-sm md:text-base text-slate-600 ">
                    আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন
                    অথবা আপনার দক্ষতা বাড়াতে চান,আমাদের Interactive Lessons আপনাকে নিয়ে যাবে অন্য একটি Level এ
                </p>

                <div>
                    <input type="text" placeholder="Enter Your Name" class="px-3 py-2 rounded-md ">
                </div>

                <div>
                    <input type="text" placeholder="123456" class="px-3 py-2 rounded-md">
                </div>

                <button class="btn btn-primary">Get Started</button>
            </div>

            <!-- right side -->
            <div class="hidden md:block">
                <img src="assets/hero-student.png" alt="">
            </div>
        </div>
    </section>
</body>

</html>
